# Read-only MEM-AP access for the reviewed bare UNO Q timing capture.
# Omits reset pins, Cortex targets, flash drivers, and target event hooks.
# Independently reviewed before use; Python enforces identities and read bounds.
adapter driver linuxgpiod
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
transport select swd
adapter speed 4000
reset_config none
source /opt/openocd/share/openocd/scripts/target/swj-dp.tcl
swj_newdap sumox cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x0be12477
dap create sumox.dap -chain-position sumox.cpu
target create sumox.mem mem_ap -dap sumox.dap -ap-num 0
targets sumox.mem
gdb_port disabled
telnet_port disabled
tcl_port disabled
init
